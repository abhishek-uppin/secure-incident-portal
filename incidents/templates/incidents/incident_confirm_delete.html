{% extends "incidents/base.html" %}

{% block title %}Delete incident{% endblock %}

{% block content %}
<h1>Delete incident</h1>
<p>Delete incident #{{ incident.pk }}: {{ incident.title }}? This cannot be undone.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Delete</button>
  <a href="{% url 'incident-detail' incident.pk %}">Cancel</a>
</form>
{% endblock %}
